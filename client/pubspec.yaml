name: stonepad
description: "Stonepad - Self-hostable markdown notes with mobile sync"
publish_to: 'none'
version: 0.0.3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  connectivity_plus: ^7.1.1
  minio: ^3.5.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  file_picker: ^10.3.10
  crypto: ^3.0.6
  http: ^1.3.0
  flutter_markdown_plus: ^1.0.7
  window_manager: ^0.5.1
  local_auth: ^3.0.1
  flex_color_picker: ^3.8.0
  internet_connection_checker_plus: ^3.0.0
  dynamic_color: ^1.8.1
  google_fonts: ^8.1.0
  yaml: ^3.1.3
  local_auth_android: ^2.0.8
  local_auth_darwin: ^2.0.3
  flutter_quill: ^11.5.0
  markdown_quill: ^4.3.0
  markdown: ^7.3.1
  markdown_widget: ^2.3.2+8
  flutter_markdown: ^0.7.7+1
  rich_text_controller: ^3.0.1
  markdown_editor_plus: ^0.2.15
  quill_markdown: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  dbus: ^0.7.13
  matcher: ^0.12.20
  meta: ^1.18.2
  test_api: ^0.7.12
  vector_math: ^2.3.0
  xml: ^7.0.1
  intl: ^0.19.0

flutter:
  uses-material-design: true
